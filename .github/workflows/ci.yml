name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Go Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run quality gate
        run: make check

  reports:
    name: Report Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build PipelineGuard
        run: make build

      - name: Generate JSON report
        run: |
          mkdir -p .reports

          ./bin/pipelineguard scan \
            --policy .pipelineguard.yml \
            --format json \
            --output .reports/secure.json \
            testdata/secure

      - name: Generate SARIF report
        run: |
          ./bin/pipelineguard scan \
            --policy .pipelineguard.yml \
            --format sarif \
            --output .reports/secure.sarif \
            testdata/secure

      - name: Generate HTML report
        run: |
          ./bin/pipelineguard scan \
            --policy .pipelineguard.yml \
            --format html \
            --output .reports/secure.html \
            testdata/secure

      - name: Validate reports
        run: |
          python3 -m json.tool .reports/secure.json >/dev/null
          python3 -m json.tool .reports/secure.sarif >/dev/null
          grep -q '#ABSL SECURITY' .reports/secure.html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: pipelineguard-reports
          path: .reports/
