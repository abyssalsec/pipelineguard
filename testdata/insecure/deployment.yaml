apiVersion: apps/v1
kind: Deployment

metadata:
  name: insecure-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo

  template:
    metadata:
      labels:
        app: demo

    spec:
      hostNetwork: true
      hostPID: true

      containers:
        - name: demo
          image: nginx:latest

          securityContext:
            privileged: true
